name: Build and Pre-Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev pkg-config gcc file

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build
          cd ..

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Wails App (Default WebKit2 4.0)
        run: |
          wails build -platform linux/amd64 -clean

      - name: Package Linux .tar.gz (WebKit2 4.0)
        run: |
          mkdir -p dist
          tar -czvf "dist/TurnP2P-linux-amd64-webkit2_40.tar.gz" -C build/bin turnp2p

      - name: Build Wails App (WebKit2 4.1 for Modern Linux)
        run: |
          wails build -platform linux/amd64 -tags webkit2_41 -clean

      - name: Package Linux .tar.gz (WebKit2 4.1 - Ubuntu 24.04/Debian 12/Arch/Fedora)
        run: |
          tar -czvf "dist/TurnP2P-linux-amd64-webkit2_41.tar.gz" -C build/bin turnp2p

      - name: Build Linux .deb Package
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          [ "$VERSION" = "" ] && VERSION="1.0.0"
          DEB_DIR="turnp2p_${VERSION}_amd64"
          mkdir -p "${DEB_DIR}/DEBIAN"
          mkdir -p "${DEB_DIR}/usr/bin"
          mkdir -p "${DEB_DIR}/usr/share/applications"
          mkdir -p "${DEB_DIR}/usr/share/icons/hicolor/512x512/apps"

          cp build/bin/turnp2p "${DEB_DIR}/usr/bin/turnp2p"
          chmod 755 "${DEB_DIR}/usr/bin/turnp2p"
          cp assets/turnp2p.desktop "${DEB_DIR}/usr/share/applications/turnp2p.desktop"
          cp assets/icon.png "${DEB_DIR}/usr/share/icons/hicolor/512x512/apps/turnp2p.png"

          cat <<EOF > "${DEB_DIR}/DEBIAN/control"
          Package: turnp2p
          Version: ${VERSION}
          Section: net
          Priority: optional
          Architecture: amd64
          Maintainer: NullCore Developer
          Depends: libgtk-3-0, libwebkit2gtk-4.1-0 | libwebkit2gtk-4.0-37
          Description: TurnP2P - Virtual P2P Mesh Network over VK TURN
          EOF

          dpkg-deb --build "${DEB_DIR}" "dist/TurnP2P-linux-amd64.deb"

      - name: Build Linux AppImage
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          [ "$VERSION" = "" ] && VERSION="1.0.0"
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/512x512/apps

          cp build/bin/turnp2p AppDir/usr/bin/turnp2p
          cp assets/turnp2p.desktop AppDir/turnp2p.desktop
          cp assets/icon.png AppDir/turnp2p.png
          cp assets/icon.png AppDir/.DirIcon

          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          export PATH="${HERE}/usr/bin:${PATH}"
          exec "${HERE}/usr/bin/turnp2p" "$@"
          EOF
          chmod +x AppDir/AppRun

          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage --appimage-extract
          ARCH=x86_64 squashfs-root/AppRun AppDir "dist/TurnP2P-linux-x86_64.AppImage"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/*

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Build Frontend
        shell: bash
        run: |
          cd frontend
          npm install
          npm run build
          cd ..

      - name: Install NSIS
        run: choco install nsis -y

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Wails App with Embedded WebView2 & NSIS Installer
        run: |
          wails build -platform windows/amd64 -webview2 embed -nsis -clean

      - name: Package Windows Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path build/bin/turnp2p.exe -DestinationPath "dist/TurnP2P-windows-amd64-portable.zip"
          if (Test-Path "build/bin/turnp2p-amd64-installer.exe") {
            Copy-Item "build/bin/turnp2p-amd64-installer.exe" -Destination "dist/TurnP2P-windows-amd64-installer.exe"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: dist/*

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Display downloaded files
        run: ls -lh release-artifacts

      - name: Create GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
